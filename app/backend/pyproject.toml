[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for hospitalization risk prediction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "scikit-learn==1.9.0",
    "uvicorn>=0.52.4",
    "mangum>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
