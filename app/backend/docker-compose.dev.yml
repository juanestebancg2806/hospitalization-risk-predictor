# Development stack (hot-reload). From app/backend:
#   docker compose -f docker-compose.dev.yml up --build
#
# If port 8000 is busy:
#   API_PORT=8001 docker compose -f docker-compose.dev.yml up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
      ]
    volumes:
      - ../model:/app/model:ro
      - .:/app
      - api_venv:/app/.venv
    environment:
      MODEL_PATH: /app/model/modelo_riesgo_hospitalizacion_v1.pkl
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  api_venv:
